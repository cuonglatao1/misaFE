version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: misa_salary_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: misa_salary
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./Database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: misa_salary_api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=misa_salary;User=root;Password=root;CharSet=utf8mb4;
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
